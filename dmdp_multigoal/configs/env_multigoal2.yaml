env:
  id: SafetyPointMultiGoal2-v0
  alternatives:
    - SafetyPointMultiGoal2-v0
  family: multigoal2
  require_multi_agent: true
  allow_single_agent_fallback: false
  num_envs: 4
  max_episode_steps: 1000
  seed: 7

features:
  names: [d_goal, d_hazard, d_vase, d_agent, speed]
  expected_agents: 2
  hazard_threshold: 0.35
  vase_threshold: 0.35
  agent_threshold: 0.35
  default_missing_distance: 10.0

target_distribution:
  type: handcrafted
  mu: [0.30, 1.50, 1.50, 1.00, 0.40]
  sigma: [0.20, 0.50, 0.50, 0.35, 0.20]
