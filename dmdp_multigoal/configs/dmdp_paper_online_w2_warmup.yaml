method: dmdp_paper_online
seed: 7
device: cpu
total_steps: 100000
rollout_steps: 256
num_epochs: 4
minibatch_size: 256
gamma: 0.99
gae_lambda: 0.95
clip_ratio: 0.2
entropy_coef: 0.01
value_coef: 0.5
learning_rate: 0.0003
max_grad_norm: 0.5

reward:
  base_cost_penalty: 0.1
  cost_penalty: 0.12
  distribution_penalty: 0.015
  tail_penalty: 0.003
  lyapunov_penalty: 0.001
  tail_mode: smooth
  warmup_steps: 30000

lyapunov:
  fit_coef: 0.5
  decrease_coef: 0.2
  decrease_margin: 0.0

network:
  hidden_sizes: [128, 128]
  activation: tanh
  context_dim: 32

target_distribution:
  path: null
  fallback: handcrafted

output:
  checkpoint: outputs/checkpoints/dmdp_paper_online_latest.pt
  metrics: outputs/metrics/dmdp_paper_online_train.json
