method: mappo
seed: 7
device: cpu
total_steps: 10000
rollout_steps: 256
num_epochs: 4
minibatch_size: 512
gamma: 0.99
gae_lambda: 0.95
clip_ratio: 0.2
entropy_coef: 0.01
value_coef: 0.5
learning_rate: 0.0003
max_grad_norm: 0.5
cost_penalty: 0.1

network:
  hidden_sizes: [128, 128]
  activation: tanh

output:
  checkpoint: outputs/checkpoints/mappo_latest.pt
  metrics: outputs/metrics/mappo_train.json
